name: TradRL governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-of-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Validate TradRL program governance
        run: node scripts/validate-tradrl-governance.mjs
